<!doctype html>
<html lang="en" data-window-material="fallback">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:* https: wss:; font-src 'self' data:; frame-src https://www.youtube-nocookie.com; img-src 'self' data: blob: https://*.giphy.com https://i.ytimg.com; media-src 'self' data: blob: https://*.giphy.com; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta
      name="theme-color"
      content="#000000"
      data-scheme="dark"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#f4f4f4"
      data-scheme="light"
      media="(prefers-color-scheme: light)"
    />
    <link rel="icon" type="image/svg+xml" href="/bakbak.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Bakbak — a private voice and chat room for close friends."
    />
    <style>
      html,
      body,
      #root {
        min-width: 100%;
        min-height: 100%;
        background: #171717;
      }

      @media (prefers-color-scheme: light) {
        html,
        body,
        #root {
          background: #fbfbf8;
        }
      }

      html[data-color-scheme="dark"],
      html[data-color-scheme="dark"] body,
      html[data-color-scheme="dark"] #root {
        background: #171717;
      }

      html[data-color-scheme="light"],
      html[data-color-scheme="light"] body,
      html[data-color-scheme="light"] #root {
        background: #fbfbf8;
      }
    </style>
    <title>Bakbak</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
