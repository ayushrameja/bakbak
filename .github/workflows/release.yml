name: Desktop release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: SemVer bump for a manually requested release
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
      migration_rehearsal_passed:
        description: Confirm the installed Tauri-to-Electron rehearsal passed on macOS and Windows
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

env:
  BAKBAK_NATIVE_SCREEN_AUDIO_CANDIDATE: "false"
  VITE_DATA_MODE: live
  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
  VITE_LIVEKIT_URL: ${{ vars.VITE_LIVEKIT_URL }}
  VITE_BACKEND_REGION: ${{ vars.VITE_BACKEND_REGION }}
  VITE_GIPHY_API_KEY: ${{ vars.VITE_GIPHY_API_KEY }}
  VITE_BUILD_REVISION: ${{ github.sha }}

jobs:
  prepare:
    if: >-
      vars.ELECTRON_MIGRATION_REHEARSED == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.migration_rehearsal_passed)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.version.outputs.skip }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read merged pull request labels
        id: labels
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          labels=""
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            labels="$(gh api "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].labels[].name' 2>/dev/null | paste -sd, - || true)"
          fi
          echo "labels=$labels" >> "$GITHUB_OUTPUT"
      - name: Resolve release version
        id: version
        env:
          LABELS: ${{ steps.labels.outputs.labels }}
          MANUAL_BUMP: ${{ inputs.bump }}
        shell: bash
        run: |
          current="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)"
          fallback="$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")"
          node scripts/release-version.mjs \
            --current "$current" \
            --fallback "$fallback" \
            --labels "$LABELS" \
            --bump "$MANUAL_BUMP" >> "$GITHUB_OUTPUT"

  validate:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm native:test
      - run: node scripts/check-release-env.mjs
      - run: pnpm check
      - run: pnpm electron:compile

  build:
    needs: [prepare, validate]
    if: needs.prepare.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-arm64
            name: macOS Apple Silicon
            runner: macos-26
            builder_args: --mac --arm64
            artifact_paths: |
              release/*.dmg
              release/*.zip
              release/*.blockmap
              release/latest-mac.yml
              release/*.app.tar.gz
              release/*.app.tar.gz.sig
          - id: windows-x64
            name: Windows x64
            runner: windows-latest
            builder_args: --win --x64
            artifact_paths: |
              release/*.exe
              release/*.blockmap
              release/latest.yml
              release/*.exe.sig
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm native:test
      - run: node scripts/set-version.mjs ${{ needs.prepare.outputs.version }}
      - run: node scripts/check-release-env.mjs
      - run: pnpm desktop:prepare
      - run: pnpm exec electron-builder ${{ matrix.builder_args }} --publish never
      - name: Create legacy macOS updater payload
        if: matrix.id == 'macos-arm64'
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          artifact="release/Bakbak-${RELEASE_VERSION}-macos-arm64.app.tar.gz"
          codesign --verify --deep --strict release/mac-arm64/Bakbak.app
          tar --no-mac-metadata --no-xattrs -czf "$artifact" -C release/mac-arm64 Bakbak.app
          pnpm dlx @tauri-apps/cli@2.11.4 signer sign "$artifact"
      - name: Sign legacy Windows updater payload
        if: matrix.id == 'windows-x64'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $artifact = "release/Bakbak-$env:RELEASE_VERSION-windows-x64-setup.exe"
          pnpm dlx @tauri-apps/cli@2.11.4 signer sign $artifact
      - name: Scan compiled application for forbidden secrets
        run: node scripts/check-bundle-secrets.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: bakbak-release-${{ matrix.id }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: bakbak-release-*
          path: release-assets
          merge-multiple: true
      - name: Generate and verify legacy updater manifest
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          mac_archive="release-assets/Bakbak-${RELEASE_VERSION}-macos-arm64.app.tar.gz"
          tar -tzf "$mac_archive" | node scripts/verify-legacy-macos-archive.mjs
          node scripts/create-legacy-updater-manifest.mjs \
            --version "$RELEASE_VERSION" \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --mac-artifact "$mac_archive" \
            --windows-artifact "release-assets/Bakbak-${RELEASE_VERSION}-windows-x64-setup.exe" \
            --output release-assets/latest.json
          node scripts/verify-updater-manifest.mjs release-assets/latest.json "$RELEASE_VERSION"
      - name: Create draft and upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --draft \
              --generate-notes \
              --target "$GITHUB_SHA" \
              --title "Bakbak v${RELEASE_VERSION}"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
      - name: Verify supported installers and update metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          test "$(printf '%s\n' "$assets" | grep -Ec '\.dmg$')" -eq 1
          test "$(printf '%s\n' "$assets" | grep -Ec '\.zip$')" -eq 1
          test "$(printf '%s\n' "$assets" | grep -Ec '\.exe$')" -eq 1
          test "$(printf '%s\n' "$assets" | grep -Ec '^latest-mac\.yml$')" -eq 1
          test "$(printf '%s\n' "$assets" | grep -Ec '^latest\.yml$')" -eq 1
          test "$(printf '%s\n' "$assets" | grep -Ec '^latest\.json$')" -eq 1
          test "$(printf '%s\n' "$assets" | grep -Eic '(darwin|macos).*(x86_64|x64)')" -eq 0
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest

  sync-version:
    needs: [prepare, publish]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Synchronize tracked application version
        id: version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          node scripts/set-version.mjs "$RELEASE_VERSION"
          if git diff --quiet -- package.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit synchronized version
        id: commit
        if: steps.version.outputs.changed == 'true'
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          branch="automation/release-v${RELEASE_VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add package.json
          git commit -m "chore(release): sync version to ${RELEASE_VERSION} [skip ci]"
          git push origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Merge synchronized version
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          VERSION_BRANCH: ${{ steps.commit.outputs.branch }}
          VERSION_HEAD: ${{ steps.commit.outputs.head }}
        shell: bash
        run: node scripts/sync-release-pr.mjs
