name: Tauri desktop release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: SemVer bump for a manually requested release
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
      tauri_2_acceptance_matrix_passed:
        description: Confirm both installed product matrices, 30-minute screen/external-audio runs, and migration/update rehearsals passed
        required: true
        default: false
        type: boolean
      acceptance_matrix_source_sha:
        description: Exact 40-character candidate commit SHA that passed the installed matrix
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tauri-desktop-release
  cancel-in-progress: false

env:
  BAKBAK_NATIVE_SCREEN_AUDIO_CANDIDATE: "false"
  VITE_DATA_MODE: live
  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
  VITE_LIVEKIT_URL: ${{ vars.VITE_LIVEKIT_URL }}
  VITE_BACKEND_REGION: ${{ vars.VITE_BACKEND_REGION }}
  VITE_GIPHY_API_KEY: ${{ vars.VITE_GIPHY_API_KEY }}
  VITE_BUILD_REVISION: ${{ github.sha }}

jobs:
  prepare:
    if: >-
      vars.TAURI_2_ACCEPTANCE_MATRIX_SHA == github.sha ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.tauri_2_acceptance_matrix_passed &&
       inputs.acceptance_matrix_source_sha == github.sha)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.version.outputs.skip }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Read merged pull request labels
        id: labels
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          labels=""
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            labels="$(gh api "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].labels[].name' 2>/dev/null | paste -sd, - || true)"
          fi
          echo "labels=$labels" >> "$GITHUB_OUTPUT"
      - name: Resolve release version
        id: version
        env:
          LABELS: ${{ steps.labels.outputs.labels }}
          MANUAL_BUMP: ${{ inputs.bump }}
        shell: bash
        run: |
          current="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)"
          fallback="$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")"
          node scripts/release-version.mjs \
            --current "$current" \
            --fallback "$fallback" \
            --labels "$LABELS" \
            --bump "$MANUAL_BUMP" >> "$GITHUB_OUTPUT"
      - name: Require the accepted candidate to carry the release version
        if: steps.version.outputs.skip != 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          node scripts/set-version.mjs --check
          tracked_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")"
          if [[ "$tracked_version" != "$RELEASE_VERSION" ]]; then
            echo "Tracked version $tracked_version does not match resolved release $RELEASE_VERSION. Merge a version bump and rerun the candidate." >&2
            exit 1
          fi

  validate:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .dvmrc
          cache: true
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: clippy, rustfmt
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Install Linux native build prerequisites
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          libssl-dev
          libwebkit2gtk-4.1-dev
          libxdo-dev
      - run: pnpm install --frozen-lockfile
      - name: Validate native Rust crates
        run: |
          cargo fmt --check --manifest-path native/screen-share-helper/Cargo.toml
          cargo clippy --locked --manifest-path native/screen-share-helper/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path native/screen-share-helper/Cargo.toml
          cargo fmt --check --manifest-path native/external-audio/Cargo.toml
          cargo clippy --locked --manifest-path native/external-audio/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path native/external-audio/Cargo.toml
          cargo fmt --check --manifest-path src-tauri/Cargo.toml
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Validate Supabase Edge Functions
        run: |
          deno task --config supabase/deno.json check
          deno task --config supabase/deno.json test
      - name: Validate renderer and fallback shell
        run: |
          node scripts/check-release-env.mjs
          pnpm check
          pnpm electron:compile
      - name: Validate database policies with pgTAP
        run: |
          supabase start --exclude vector
          supabase test db

  build:
    needs: [prepare, validate]
    if: needs.prepare.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-aarch64
            name: macOS Apple Silicon
            runner: macos-26
            rust_target: aarch64-apple-darwin
            tauri_config: src-tauri/tauri.macos.conf.json
            artifact_paths: |
              release-tauri/*.dmg
              release-tauri/MACOS-MANUAL-INSTALL.txt
          - id: windows-x64
            name: Windows x64
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            tauri_config: src-tauri/tauri.windows.conf.json
            artifact_paths: |
              release-tauri/*.exe
              release-tauri/*.exe.sig
    name: Build Tauri ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: clippy, rustfmt
          targets: ${{ matrix.rust_target }}
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-release-env.mjs
      - name: Validate platform-native Rust controllers
        run: |
          cargo clippy --locked --manifest-path native/screen-share-helper/Cargo.toml --all-targets --target ${{ matrix.rust_target }} -- -D warnings
          cargo test --locked --manifest-path native/screen-share-helper/Cargo.toml --target ${{ matrix.rust_target }}
          cargo clippy --locked --manifest-path native/external-audio/Cargo.toml --all-targets --target ${{ matrix.rust_target }} -- -D warnings
          cargo test --locked --manifest-path native/external-audio/Cargo.toml --target ${{ matrix.rust_target }}
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --target ${{ matrix.rust_target }} -- -D warnings
          cargo test --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.rust_target }}
      - name: Prepare helper and renderer without signing secrets
        run: |
          pnpm tauri:prepare
          pnpm build
      - name: Build verifiable macOS application
        if: matrix.id == 'macos-aarch64'
        run: >-
          pnpm exec tauri build
          --bundles app
          --target ${{ matrix.rust_target }}
          --config src-tauri/tauri.sidecar.conf.json
          --config ${{ matrix.tauri_config }}
          --config src-tauri/tauri.prebuilt.conf.json
      - name: Verify ad-hoc signed macOS application
        if: matrix.id == 'macos-aarch64'
        shell: bash
        run: |
          app_path="src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos/Bakbak.app"
          test -d "$app_path"
          helper_path="$(find "$app_path/Contents/MacOS" -maxdepth 1 -type f -name 'bakbak-screen-share-helper*' -print -quit)"
          test -n "$helper_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          signature="$(codesign --display --verbose=4 "$app_path" 2>&1)"
          printf '%s\n' "$signature" | grep -q '^Signature=adhoc$'
      - name: Build manual-install macOS DMG
        if: matrix.id == 'macos-aarch64'
        run: >-
          pnpm exec tauri build
          --bundles dmg
          --target ${{ matrix.rust_target }}
          --config src-tauri/tauri.sidecar.conf.json
          --config ${{ matrix.tauri_config }}
          --config src-tauri/tauri.prebuilt.conf.json
      - name: Build signed Windows Tauri release
        if: matrix.id == 'windows-x64'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "${TAURI_SIGNING_PRIVATE_KEY:-}"
          test -n "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}"
          pnpm exec tauri build \
            --target ${{ matrix.rust_target }} \
            --config src-tauri/tauri.sidecar.conf.json \
            --config ${{ matrix.tauri_config }} \
            --config src-tauri/tauri.prebuilt.conf.json
      - name: Verify and collect manual-only macOS package
        if: matrix.id == 'macos-aarch64'
        shell: bash
        run: |
          bundle_root="src-tauri/target/${{ matrix.rust_target }}/release/bundle"
          dmgs=("$bundle_root/dmg/"*.dmg)
          test "${#dmgs[@]}" -eq 1
          test -f "${dmgs[0]}"
          hdiutil verify "${dmgs[0]}"
          if find "$bundle_root" -type f \( -name '*.sig' -o -name 'latest*.json' -o -name 'latest*.yml' \) -print -quit | grep -q .; then
            echo "macOS updater metadata must not be produced" >&2
            exit 1
          fi
          mkdir -p release-tauri
          cp "${dmgs[0]}" release-tauri/
          printf '%s\n' \
            'Bakbak 2.0 for macOS is ad-hoc signed and must be installed manually from this DMG.' \
            'Automatic macOS updates and permission continuity require Developer ID signing and notarization.' \
            > release-tauri/MACOS-MANUAL-INSTALL.txt
      - name: Verify and collect signed Windows updater package
        if: matrix.id == 'windows-x64'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $bundleRoot = "src-tauri/target/${{ matrix.rust_target }}/release/bundle/nsis"
          $installers = @(Get-ChildItem -Path $bundleRoot -Filter "*-setup.exe")
          if ($installers.Count -ne 1) { throw "Expected exactly one Windows NSIS installer." }
          $signature = "$($installers[0].FullName).sig"
          if (!(Test-Path $signature) -or (Get-Item $signature).Length -eq 0) {
            throw "The Windows updater signature is required."
          }
          New-Item -ItemType Directory -Force -Path release-tauri | Out-Null
          $target = "release-tauri/Bakbak-$env:RELEASE_VERSION-windows-x64-setup.exe"
          Copy-Item $installers[0].FullName $target
          Copy-Item $signature "$target.sig"
          node scripts/verify-tauri-updater-signature.mjs `
            --artifact $target `
            --signature "$target.sig" `
            --config src-tauri/tauri.conf.json
      - name: Scan compiled application for forbidden secrets
        run: node scripts/check-bundle-secrets.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: bakbak-tauri-release-${{ matrix.id }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v4
        with:
          pattern: bakbak-tauri-release-*
          path: release-assets
          merge-multiple: true
      - name: Generate and verify Windows Tauri updater manifest
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          windows_artifact="release-assets/Bakbak-${RELEASE_VERSION}-windows-x64-setup.exe"
          test -s "$windows_artifact"
          test -s "$windows_artifact.sig"
          node scripts/verify-tauri-updater-signature.mjs \
            --artifact "$windows_artifact" \
            --signature "$windows_artifact.sig" \
            --config src-tauri/tauri.conf.json
          node scripts/create-tauri-updater-manifest.mjs \
            --version "$RELEASE_VERSION" \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --windows-artifact "$windows_artifact" \
            --output release-assets/latest.json
          node scripts/verify-updater-manifest.mjs \
            release-assets/latest.json "$RELEASE_VERSION" --allow-missing-macos
      - name: Create draft and upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          require_exact_draft() {
            local release_state="$1"
            local is_draft
            local target_commitish
            is_draft="$(jq -r '.isDraft' <<< "$release_state")"
            target_commitish="$(jq -r '.targetCommitish' <<< "$release_state")"
            if [[ "$is_draft" != "true" || "$target_commitish" != "$GITHUB_SHA" ]]; then
              echo "Release $RELEASE_TAG must be a draft targeting exact accepted source $GITHUB_SHA." >&2
              exit 1
            fi
          }

          release_title="Bakbak v${RELEASE_VERSION} — Tauri · macOS manual install"
          if release_state="$(gh release view "$RELEASE_TAG" --json isDraft,targetCommitish 2>/dev/null)"; then
            require_exact_draft "$release_state"
            gh release edit "$RELEASE_TAG" --title "$release_title"
          else
            gh release create "$RELEASE_TAG" \
              --draft \
              --generate-notes \
              --target "$GITHUB_SHA" \
              --title "$release_title"
          fi
          release_state="$(gh release view "$RELEASE_TAG" --json isDraft,targetCommitish)"
          require_exact_draft "$release_state"
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
      - name: Verify supported installers and update metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          test "$(printf '%s\n' "$assets" | grep -Ec '\.dmg$')" -eq 1
          test "$(printf '%s\n' "$assets" | grep -Ec '\.exe$')" -eq 1
          test "$(printf '%s\n' "$assets" | grep -Ec '\.exe\.sig$')" -eq 1
          test "$(printf '%s\n' "$assets" | grep -Ec '^latest\.json$')" -eq 1
          test "$(printf '%s\n' "$assets" | grep -Ec '^MACOS-MANUAL-INSTALL\.txt$')" -eq 1
          test "$(printf '%s\n' "$assets" | grep -Ec '\.zip$|\.app\.tar\.gz|^latest(-mac)?\.yml$')" -eq 0
          test "$(printf '%s\n' "$assets" | grep -Eic '(darwin|macos).*(x86_64|x64)')" -eq 0
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          release_state="$(gh release view "$RELEASE_TAG" --json isDraft,targetCommitish)"
          test "$(jq -r '.isDraft' <<< "$release_state")" = "true"
          test "$(jq -r '.targetCommitish' <<< "$release_state")" = "$GITHUB_SHA"
          gh release edit "$RELEASE_TAG" --draft=false --latest
