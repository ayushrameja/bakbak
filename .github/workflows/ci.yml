name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  BAKBAK_NATIVE_SCREEN_AUDIO_CANDIDATE: "false"

jobs:
  validate:
    name: Validate renderer and Electron shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm native:test
      - run: pnpm check
      - run: pnpm electron:compile

  package:
    name: Package ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-arm64
            name: macOS Apple Silicon
            runner: macos-26
            builder_args: --mac --arm64
            artifact_paths: |
              release/*.dmg
              release/*.zip
              release/latest-mac.yml
          - id: windows-x64
            name: Windows x64
            runner: windows-latest
            builder_args: --win --x64
            artifact_paths: |
              release/*.exe
              release/latest.yml
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm native:test
      - run: pnpm desktop:prepare
      - run: pnpm exec electron-builder ${{ matrix.builder_args }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: bakbak-pr-${{ matrix.id }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
