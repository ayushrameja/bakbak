name: Stabilization candidate

run-name: Stabilization candidate · ${{ inputs.source_sha || github.event.pull_request.head.sha }}

on:
  pull_request:
    branches: [main]
    types: [labeled]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character commit SHA to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stabilization-candidate-${{ github.event.pull_request.number || inputs.source_sha }}
  cancel-in-progress: false

env:
  VITE_DATA_MODE: live
  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
  VITE_LIVEKIT_URL: ${{ vars.VITE_LIVEKIT_URL }}
  VITE_BACKEND_REGION: ${{ vars.VITE_BACKEND_REGION }}
  VITE_GIPHY_API_KEY: ${{ vars.VITE_GIPHY_API_KEY }}

jobs:
  prepare:
    name: Validate exact source
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'stabilization:candidate'
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      short_sha: ${{ steps.source.outputs.short_sha }}
    steps:
      - name: Resolve exact source revision
        id: source
        env:
          REQUESTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.source_sha }}
        shell: bash
        run: |
          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "source_sha must be one exact 40-character commit SHA" >&2
            exit 1
          fi
          normalized_sha="${REQUESTED_SHA,,}"
          echo "source_sha=$normalized_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=${normalized_sha:0:12}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.source_sha }}
          fetch-depth: 0
      - name: Verify checked-out revision
        env:
          REQUESTED_SHA: ${{ steps.source.outputs.source_sha }}
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - name: Validate live candidate environment
        env:
          VITE_BUILD_REVISION: ${{ steps.source.outputs.source_sha }}
        run: node scripts/check-release-env.mjs
      - name: Run integrated renderer gate
        env:
          VITE_BUILD_REVISION: ${{ steps.source.outputs.source_sha }}
        run: pnpm check
      - name: Run locked native checks
        run: |
          cargo check --locked --manifest-path src-tauri/Cargo.toml
          cargo test --locked --manifest-path src-tauri/Cargo.toml

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-aarch64
            name: macOS Apple Silicon
            platform: macos-26
            args: --target aarch64-apple-darwin --bundles app,dmg
            rust_targets: aarch64-apple-darwin
            artifact_paths: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
              candidate-manifest.json
          - id: windows-x64
            name: Windows x64
            platform: windows-latest
            args: --bundles nsis
            rust_targets: ""
            artifact_paths: |
              src-tauri/target/release/bundle/nsis/*.exe
              candidate-manifest.json
    runs-on: ${{ matrix.platform }}
    env:
      VITE_BUILD_REVISION: ${{ needs.prepare.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-release-env.mjs
      - name: Build installable candidate without updater publication
        run: pnpm tauri build ${{ matrix.args }} --config src-tauri/tauri.local.conf.json
      - name: Scan compiled candidate for forbidden secrets
        run: node scripts/check-bundle-secrets.mjs
      - name: Write candidate provenance
        run: >-
          node scripts/write-stabilization-candidate-manifest.mjs
          --source-sha "${{ needs.prepare.outputs.source_sha }}"
          --platform "${{ matrix.id }}"
          --workflow-run "${{ github.run_id }}.${{ github.run_attempt }}"
          --output candidate-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: bakbak-stabilization-${{ matrix.id }}-${{ needs.prepare.outputs.short_sha }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
