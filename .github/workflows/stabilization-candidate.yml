name: Tauri stabilization candidate

run-name: Tauri stabilization candidate · ${{ inputs.source_sha || github.event.pull_request.head.sha }}

on:
  pull_request:
    branches: [main]
    types: [labeled]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character commit SHA to build
        required: true
        type: string
      windows_update_rehearsal:
        description: Build a private signed base-to-next-patch Windows update rehearsal kit
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: tauri-stabilization-candidate-${{ github.event.pull_request.number || inputs.source_sha }}
  cancel-in-progress: false

env:
  VITE_DATA_MODE: live
  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
  VITE_LIVEKIT_URL: ${{ vars.VITE_LIVEKIT_URL }}
  VITE_BACKEND_REGION: ${{ vars.VITE_BACKEND_REGION }}
  VITE_GIPHY_API_KEY: ${{ vars.VITE_GIPHY_API_KEY }}

jobs:
  prepare:
    name: Validate exact source and release gates
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'stabilization:candidate'
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      short_sha: ${{ steps.source.outputs.short_sha }}
    steps:
      - name: Resolve exact source revision
        id: source
        env:
          REQUESTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.source_sha }}
        shell: bash
        run: |
          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "source_sha must be one exact 40-character commit SHA" >&2
            exit 1
          fi
          normalized_sha="${REQUESTED_SHA,,}"
          echo "source_sha=$normalized_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=${normalized_sha:0:12}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.source_sha }}
          fetch-depth: 0
      - name: Verify checked-out revision
        env:
          REQUESTED_SHA: ${{ steps.source.outputs.source_sha }}
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .dvmrc
          cache: true
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: clippy, rustfmt
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Install Linux native build prerequisites
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          libssl-dev
          libwebkit2gtk-4.1-dev
          libxdo-dev
      - run: pnpm install --frozen-lockfile
      - name: Validate native Rust crates
        run: |
          cargo fmt --check --manifest-path native/screen-share-helper/Cargo.toml
          cargo clippy --locked --manifest-path native/screen-share-helper/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path native/screen-share-helper/Cargo.toml
          cargo fmt --check --manifest-path native/external-audio/Cargo.toml
          cargo clippy --locked --manifest-path native/external-audio/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path native/external-audio/Cargo.toml
          cargo fmt --check --manifest-path src-tauri/Cargo.toml
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Validate Supabase Edge Functions
        run: |
          deno task --config supabase/deno.json check
          deno task --config supabase/deno.json test
      - name: Validate live renderer and fallback shell
        env:
          VITE_BUILD_REVISION: ${{ steps.source.outputs.source_sha }}
        run: |
          node scripts/check-release-env.mjs
          pnpm check
          pnpm electron:compile
      - name: Validate database policies with pgTAP
        run: |
          supabase start --exclude vector
          supabase test db

  build:
    name: Build Tauri ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-aarch64
            name: macOS Apple Silicon
            runner: macos-26
            rust_target: aarch64-apple-darwin
            tauri_config: src-tauri/tauri.macos.conf.json
            artifact_paths: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
              candidate-manifest.json
          - id: windows-x64
            name: Windows x64
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            tauri_config: src-tauri/tauri.windows.conf.json
            artifact_paths: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
              candidate-manifest.json
    runs-on: ${{ matrix.runner }}
    env:
      VITE_BUILD_REVISION: ${{ needs.prepare.outputs.source_sha }}
      BAKBAK_NATIVE_SCREEN_AUDIO_CANDIDATE: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: clippy, rustfmt
          targets: ${{ matrix.rust_target }}
      - run: pnpm install --frozen-lockfile
      - name: Validate platform-native Rust controllers
        run: |
          cargo clippy --locked --manifest-path native/screen-share-helper/Cargo.toml --all-targets --target ${{ matrix.rust_target }} -- -D warnings
          cargo test --locked --manifest-path native/screen-share-helper/Cargo.toml --target ${{ matrix.rust_target }}
          cargo clippy --locked --manifest-path native/external-audio/Cargo.toml --all-targets --target ${{ matrix.rust_target }} -- -D warnings
          cargo test --locked --manifest-path native/external-audio/Cargo.toml --target ${{ matrix.rust_target }}
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --target ${{ matrix.rust_target }} -- -D warnings
          cargo test --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.rust_target }}
      - run: node scripts/check-release-env.mjs
      - name: Build installable candidate without updater publication
        run: |
          pnpm tauri:prepare
          pnpm exec tauri build --target ${{ matrix.rust_target }} --config src-tauri/tauri.sidecar.conf.json --config ${{ matrix.tauri_config }} --config src-tauri/tauri.candidate.conf.json
      - name: Scan compiled candidate for forbidden secrets
        run: node scripts/check-bundle-secrets.mjs
      - name: Write candidate provenance
        run: >-
          node scripts/write-stabilization-candidate-manifest.mjs
          --source-sha "${{ needs.prepare.outputs.source_sha }}"
          --platform "${{ matrix.id }}"
          --workflow-run "${{ github.run_id }}.${{ github.run_attempt }}"
          --output candidate-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: bakbak-tauri-stabilization-${{ matrix.id }}-${{ needs.prepare.outputs.short_sha }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  windows-update-rehearsal:
    name: Build private signed Windows update rehearsal
    needs: prepare
    if: github.event_name == 'workflow_dispatch' && inputs.windows_update_rehearsal
    runs-on: windows-latest
    env:
      VITE_BUILD_REVISION: ${{ needs.prepare.outputs.source_sha }}
      BAKBAK_NATIVE_SCREEN_AUDIO_CANDIDATE: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
      - name: Verify exact rehearsal source
        env:
          REQUESTED_SHA: ${{ needs.prepare.outputs.source_sha }}
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: clippy, rustfmt
          targets: x86_64-pc-windows-msvc
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-release-env.mjs
      - name: Resolve base and derived next-patch versions
        id: versions
        shell: bash
        run: |
          node scripts/set-version.mjs --check
          node scripts/update-rehearsal-version.mjs >> "$GITHUB_OUTPUT"
      - name: Prepare base helper and renderer without signing secrets
        run: |
          pnpm tauri:prepare
          pnpm build
      - name: Build signed base rehearsal installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "${TAURI_SIGNING_PRIVATE_KEY:-}"
          test -n "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}"
          pnpm exec tauri build \
            --target x86_64-pc-windows-msvc \
            --config src-tauri/tauri.sidecar.conf.json \
            --config src-tauri/tauri.windows.conf.json \
            --config src-tauri/tauri.update-rehearsal.conf.json \
            --config src-tauri/tauri.prebuilt.conf.json
      - name: Verify and collect exact signed base installer
        shell: pwsh
        env:
          BASE_VERSION: ${{ steps.versions.outputs.base_version }}
        run: |
          $bundleRoot = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          $installers = @(
            Get-ChildItem -Path $bundleRoot -Filter "*-setup.exe" |
              Where-Object { $_.Name -like "*$env:BASE_VERSION*" }
          )
          if ($installers.Count -ne 1) { throw "Expected exactly one base NSIS installer for $env:BASE_VERSION." }
          $signature = "$($installers[0].FullName).sig"
          if (!(Test-Path $signature) -or (Get-Item $signature).Length -eq 0) {
            throw "The base rehearsal updater signature is required."
          }
          New-Item -ItemType Directory -Force -Path update-rehearsal | Out-Null
          $target = "update-rehearsal/Bakbak-$env:BASE_VERSION-windows-x64-base-setup.exe"
          Copy-Item $installers[0].FullName $target
          Copy-Item $signature "$target.sig"
          node scripts/verify-tauri-updater-signature.mjs `
            --artifact $target `
            --signature "$target.sig" `
            --config src-tauri/tauri.conf.json
      - name: Prepare derived next-patch renderer without signing secrets
        env:
          NEXT_VERSION: ${{ steps.versions.outputs.next_version }}
        shell: bash
        run: |
          node scripts/set-version.mjs "$NEXT_VERSION"
          node scripts/set-version.mjs --check
          pnpm build
      - name: Build signed next-patch rehearsal installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "${TAURI_SIGNING_PRIVATE_KEY:-}"
          test -n "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}"
          pnpm exec tauri build \
            --target x86_64-pc-windows-msvc \
            --config src-tauri/tauri.sidecar.conf.json \
            --config src-tauri/tauri.windows.conf.json \
            --config src-tauri/tauri.update-rehearsal.conf.json \
            --config src-tauri/tauri.prebuilt.conf.json
      - name: Verify and collect exact signed next-patch installer
        shell: pwsh
        env:
          NEXT_VERSION: ${{ steps.versions.outputs.next_version }}
        run: |
          $bundleRoot = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          $installers = @(
            Get-ChildItem -Path $bundleRoot -Filter "*-setup.exe" |
              Where-Object { $_.Name -like "*$env:NEXT_VERSION*" }
          )
          if ($installers.Count -ne 1) { throw "Expected exactly one next-patch NSIS installer for $env:NEXT_VERSION." }
          $signature = "$($installers[0].FullName).sig"
          if (!(Test-Path $signature) -or (Get-Item $signature).Length -eq 0) {
            throw "The next-patch rehearsal updater signature is required."
          }
          $target = "update-rehearsal/Bakbak-$env:NEXT_VERSION-windows-x64-next-setup.exe"
          Copy-Item $installers[0].FullName $target
          Copy-Item $signature "$target.sig"
          node scripts/verify-tauri-updater-signature.mjs `
            --artifact $target `
            --signature "$target.sig" `
            --config src-tauri/tauri.conf.json
      - name: Scan compiled rehearsal for forbidden secrets
        run: node scripts/check-bundle-secrets.mjs
      - name: Assemble private loopback rehearsal kit
        shell: pwsh
        env:
          BASE_VERSION: ${{ steps.versions.outputs.base_version }}
          NEXT_VERSION: ${{ steps.versions.outputs.next_version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          WORKFLOW_RUN: ${{ github.run_id }}.${{ github.run_attempt }}
        run: |
          Copy-Item src-tauri/tauri.update-rehearsal.conf.json update-rehearsal/
          node scripts/create-update-rehearsal-kit.mjs `
            --base-version $env:BASE_VERSION `
            --next-version $env:NEXT_VERSION `
            --source-sha $env:SOURCE_SHA `
            --workflow-run $env:WORKFLOW_RUN `
            --base-installer "update-rehearsal/Bakbak-$env:BASE_VERSION-windows-x64-base-setup.exe" `
            --next-installer "update-rehearsal/Bakbak-$env:NEXT_VERSION-windows-x64-next-setup.exe" `
            --config update-rehearsal/tauri.update-rehearsal.conf.json `
            --output update-rehearsal
          node scripts/verify-updater-manifest.mjs `
            update-rehearsal/latest.json $env:NEXT_VERSION --allow-missing-macos
      - uses: actions/upload-artifact@v4
        with:
          name: bakbak-windows-update-rehearsal-${{ needs.prepare.outputs.short_sha }}-${{ github.run_id }}.${{ github.run_attempt }}
          path: update-rehearsal/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
